name: Refresh HSE Dashboard

on:
  workflow_dispatch:
  push:
    paths:
      - "HSE Dashboard Rev 0(3).xlsx"
      - "build_data.py"
      - "index.html"
      - ".github/workflows/refresh-dashboard.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Excel parser
        run: |
          python -m pip install --upgrade pip openpyxl

      - name: Generate dashboard data
        run: |
          python build_data.py

      - name: Prepare GitHub Pages files
        run: |
          mkdir -p pages
          cp index.html pages/
          cp data.json pages/
          touch pages/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
